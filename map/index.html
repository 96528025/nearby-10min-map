<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>景点周边 10 分钟车程地图 · Visitor Area Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
  #map { height: 100%; }
  .info-panel {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(255,255,255,.95); border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    padding: 14px 16px; max-width: 320px; font-size: 13px; line-height: 1.5;
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  .info-panel h1 { font-size: 16px; margin: 0 0 2px; }
  .info-panel h2 { font-size: 13px; margin: 0 0 8px; font-weight: 500; color: #555; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .swatch { width: 18px; height: 14px; border-radius: 3px; flex: none;
            background: rgba(0,122,255,.25); border: 2px solid #007aff; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.5); }
  .dot.origin { background: #1d1d1f; }
  .dot.poi { background: #ff9500; }
  .meta { margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; color: #666; font-size: 11px; }
  .cats { margin-top: 10px; padding-top: 8px; border-top: 1px solid #ddd; }
  .cats h3 { font-size: 13px; margin: 0 0 6px; }
  .cat-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; cursor: pointer; user-select: none; }
  .cat-row input { margin: 0; cursor: pointer; }
  .cat-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1.5px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.4); }
  .cat-count { color: #888; font-size: 11px; margin-left: auto; }
  .popup-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .popup-sub { font-weight: 500; color: #555; margin-bottom: 6px; }
  .popup-drive { margin-top: 6px; color: #007aff; font-weight: 600; }
  .popup-note { color: #888; font-size: 11px; }
  .popup-link { display: inline-block; margin-top: 6px; font-size: 12px; }

  .search-box {
    position: absolute; top: 12px; left: 54px; z-index: 1100;
    width: min(360px, calc(100vw - 420px));
  }
  .search-row { display: flex; gap: 6px; }
  .search-row input {
    flex: 1; padding: 9px 12px; font-size: 14px; border: none; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); outline: none;
  }
  .search-row button {
    padding: 9px 14px; font-size: 14px; border: none; border-radius: 8px;
    background: #007aff; color: #fff; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .search-row button:disabled { background: #9bc4f7; cursor: default; }
  .candidates {
    margin-top: 6px; background: #fff; border-radius: 8px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .candidate { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #eee; }
  .candidate:last-child { border-bottom: none; }
  .candidate:hover { background: #f0f6ff; }
  .candidate small { color: #777; display: block; }
  .status-chip {
    margin-top: 6px; display: none; padding: 7px 12px; font-size: 12px;
    background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    color: #444;
  }
  .status-chip.on { display: block; }
  .status-chip .spin {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid #007aff; border-top-color: transparent; margin-right: 6px;
    animation: spin 0.9s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 900px) {
    .search-box { width: min(280px, calc(100vw - 330px)); }
    .info-panel { max-width: 230px; font-size: 12px; max-height: calc(100vh - 30px); }
    .info-panel h1 { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="search-box">
  <div class="search-row">
    <input id="q" type="text" placeholder="输入景点，如 Stanford University · Enter an attraction"
           autocomplete="off">
    <button id="go">搜索 Search</button>
  </div>
  <div class="candidates" id="candidates" style="display:none"></div>
  <div class="status-chip" id="status"></div>
</div>

<div class="info-panel">
  <h1 id="title">…</h1>
  <h2 id="subtitle">~10-Minute Driving Range</h2>
  <div class="legend-row"><span class="swatch"></span><span id="area-label">约 10 分钟驾车范围 · ~10-min drive area</span></div>
  <div class="legend-row"><span class="dot origin"></span><span id="origin-label">中心点 · Center</span></div>
  <div class="legend-row" id="landmark-legend" style="display:none"><span class="dot poi"></span><span>精选地标 · Featured landmarks</span></div>
  <div class="cats" id="cats"></div>
  <div class="meta" id="meta">加载中… Loading…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const APPLE_PARK = { lat: 37.33484, lon: -122.01139 };

const map = L.map('map').setView([APPLE_PARK.lat, APPLE_PARK.lon], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Isochrone: <a href="https://gis-ops.com/global-open-valhalla-server-online/">Valhalla (FOSSGIS)</a> · POI: <a href="https://overturemaps.org">Overture Maps</a>'
}).addTo(map);

const originIcon = L.divIcon({
  className: '',
  html: '<div style="width:20px;height:20px;border-radius:50%;background:#1d1d1f;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.6)"></div>',
  iconSize: [20, 20], iconAnchor: [10, 10]
});
const poiIcon = L.divIcon({
  className: '',
  html: '<div style="width:14px;height:14px;border-radius:50%;background:#ff9500;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5)"></div>',
  iconSize: [14, 14], iconAnchor: [7, 7]
});

const kindLabels = {
  restaurant: '餐厅 Restaurant', cafe: '咖啡 Cafe', fast_food: '快餐 Fast food',
  bar: '酒吧 Bar', pub: '酒馆 Pub', food_court: '美食广场 Food court',
  ice_cream: '冰淇淋 Ice cream', bakery: '烘焙 Bakery',
  hospital: '医院 Hospital', clinic: '诊所 Clinic', pharmacy: '药房 Pharmacy',
  school: '中小学 School', college: '学院 College', university: '大学 University',
  hotel: '酒店 Hotel', motel: '汽车旅馆 Motel', guest_house: '民宿 Guest house',
  supermarket: '超市 Supermarket', mall: '商场 Mall', department_store: '百货 Dept. store',
  fuel: '加油站 Gas station', charging_station: '充电站 EV charging',
  museum: '博物馆 Museum', attraction: '景点 Attraction', gallery: '美术馆 Gallery',
  park: '公园 Park'
};

function gmapsLink(f) {
  const q = encodeURIComponent(f.addr ? `${f.name} ${f.addr}` : `${f.name} ${f.lat},${f.lon}`);
  return `<a class="popup-link" target="_blank" rel="noopener" ` +
         `href="https://www.google.com/maps/search/?api=1&query=${q}">在 Google Maps 打开 ↗ · Open in Google Maps</a>`;
}

// ---- area rendering ------------------------------------------------------
let areaLayers = [];      // everything that belongs to the current area
let facilityGroups = {};  // category key -> cluster group
let catStates = {};       // category key -> checkbox on/off

function clearArea() {
  areaLayers.forEach(l => map.removeLayer(l));
  areaLayers = [];
  facilityGroups = {};
  document.getElementById('cats').innerHTML = '';
}

function renderBoundary(boundary, originName, originLat, originLon) {
  const layer = L.geoJSON(boundary, {
    style: { color: '#007aff', weight: 2, fillColor: '#007aff', fillOpacity: 0.18 }
  }).addTo(map);
  areaLayers.push(layer);

  const marker = L.marker([originLat, originLon], { icon: originIcon, zIndexOffset: 1000 })
    .addTo(map)
    .bindPopup(`
      <div class="popup-title">${originName}</div>
      <div class="popup-sub">范围中心 · Center of this area</div>
      ${gmapsLink({name: originName, lat: originLat, lon: originLon})}
    `);
  areaLayers.push(marker);

  const fitAll = () => {
    map.invalidateSize();
    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  };
  fitAll();
  if (map.getSize().x === 0) {
    const ro = new ResizeObserver(() => {
      map.invalidateSize();
      if (map.getSize().x > 0) { fitAll(); ro.disconnect(); }
    });
    ro.observe(document.getElementById('map'));
  }
}

function renderFacilities(facilities, firstRender) {
  // remember toggle states, then rebuild groups + panel
  Object.entries(facilityGroups).forEach(([key, g]) => {
    catStates[key] = map.hasLayer(g);
    map.removeLayer(g);
    areaLayers = areaLayers.filter(l => l !== g);
  });
  facilityGroups = {};
  const catsDiv = document.getElementById('cats');
  catsDiv.innerHTML = '<h3>范围内设施 · Facilities within reach</h3>';

  Object.entries(facilities.categories).forEach(([key, cat]) => {
    if (!cat.count) return;
    const group = L.markerClusterGroup({
      maxClusterRadius: 42,
      iconCreateFunction: c => L.divIcon({
        className: '',
        html: `<div style="width:28px;height:28px;border-radius:50%;background:${cat.color};` +
              `border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4);color:#fff;` +
              `display:flex;align-items:center;justify-content:center;font:600 11px sans-serif">` +
              `${c.getChildCount()}</div>`,
        iconSize: [28, 28]
      })
    });
    cat.items.forEach(f => {
      L.circleMarker([f.lat, f.lon], {
        radius: 6, color: '#fff', weight: 1.5,
        fillColor: cat.color, fillOpacity: 0.95
      }).bindPopup(`
        <div class="popup-title">${f.name}</div>
        <div class="popup-sub">${cat.label_zh} · ${cat.label_en}${f.kind ? ' — ' + (kindLabels[f.kind] || f.kind.replace(/_/g, ' ')) : ''}</div>
        ${f.addr ? `<div>${f.addr}</div>` : ''}
        <div class="popup-note">位于约 10 分钟车程范围内 · Within the ~10-min drive area</div>
        ${gmapsLink(f)}
      `).addTo(group);
    });

    const on = firstRender ? key !== 'dining' : (catStates[key] !== false);
    if (on) group.addTo(map);
    facilityGroups[key] = group;
    areaLayers.push(group);

    const row = document.createElement('label');
    row.className = 'cat-row';
    row.innerHTML = `<input type="checkbox" ${on ? 'checked' : ''}>` +
      `<span class="cat-dot" style="background:${cat.color}"></span>` +
      `<span>${cat.label_zh} · ${cat.label_en}</span>` +
      `<span class="cat-count">${cat.count}</span>`;
    row.querySelector('input').addEventListener('change', e => {
      catStates[key] = e.target.checked;
      if (e.target.checked) map.addLayer(group); else map.removeLayer(group);
    });
    catsDiv.appendChild(row);
  });
}

function renderLandmarks(landmarks) {
  document.getElementById('landmark-legend').style.display = '';
  landmarks.forEach(lm => {
    const marker = L.marker([lm.lat, lm.lon], { icon: poiIcon })
      .addTo(map)
      .bindPopup(`
        <div class="popup-title">${lm.name_zh}</div>
        <div class="popup-sub">${lm.name_en}</div>
        <div>${lm.desc_zh}</div>
        <div>${lm.desc_en}</div>
        <div class="popup-drive">🚗 自 Apple Park 驾车约 ${lm.drive_min} 分钟（${lm.drive_km} km）<br>
        ~${lm.drive_min} min drive (${lm.drive_km} km) from Apple Park</div>
        <div class="popup-note">按正常路况计算 · Free-flow conditions</div>
        ${gmapsLink({name: lm.name_en, lat: lm.lat, lon: lm.lon})}
      `);
    areaLayers.push(marker);
  });
}

function renderMeta(boundaryMeta, facMeta, extraLine) {
  const rKm = boundaryMeta.radius_m ? (boundaryMeta.radius_m / 1000).toFixed(1) : '?';
  document.getElementById('area-label').textContent =
    `约 10 分钟驾车范围（半径 ${rKm} km）· ~10-min drive (${rKm} km radius)`;
  document.getElementById('meta').innerHTML =
    `圆形范围为示意：半径取与当地真实 10 分钟等时圈<b>等面积</b>的圆（${rKm} km），按正常路况计算，不含实时交通，高峰期更久。<br>
     The circle approximates the area: its radius (${rKm} km) gives the same area as the
     routed 10-minute isochrone, free-flow conditions (longer at rush hour).<br>
     ${extraLine || ''}
     数据 Data: OpenStreetMap (Overpass) · Overture Maps · Valhalla routing (FOSSGIS)<br>
     生成 Generated: ${boundaryMeta.generated_utc || 'N/A'}（设施 Facilities: ${(facMeta || {}).generated_utc || 'N/A'}）<br>
     设施仅显示范围内有名称的场所；居民区不作标注。<br>
     Only named facilities inside the area are shown; residential areas are not marked.`;
}

function setTitle(name) {
  document.getElementById('title').textContent = `${name} 约 10 分钟车程范围`;
  document.getElementById('subtitle').textContent = `~10-Minute Driving Range from ${name}`;
  document.getElementById('origin-label').textContent = `${name}（中心 · Center）`;
}

// ---- default view: Apple Park (pre-verified static data) -----------------
function loadApplePark() {
  Promise.all([
    fetch('data/boundary.json').then(r => r.json()),
    fetch('data/facilities.json').then(r => r.json()),
    fetch('data/landmarks.json').then(r => r.json())
  ]).then(([boundary, facilities, landmarks]) => {
    clearArea();
    setTitle('Apple Park');
    renderBoundary(boundary, 'Apple Park — 苹果公司全球总部 (One Apple Park Way, Cupertino)',
                   APPLE_PARK.lat, APPLE_PARK.lon);
    renderFacilities(facilities, true);
    renderLandmarks(landmarks);
    renderMeta(boundary.metadata || {}, facilities.metadata,
      '实测本圆边界各方向车程约 9.5–12 分钟（Valhalla 路由，8 方向抽查）。<br>' +
      'Measured drive times to this circle\'s edge: ~9.5–12 min across 8 bearings.<br>');
  }).catch(err => {
    document.getElementById('meta').textContent = '数据加载失败 Data failed to load: ' + err;
  });
}

// ---- search flow ---------------------------------------------------------
const qInput = document.getElementById('q');
const goBtn = document.getElementById('go');
const candBox = document.getElementById('candidates');
const statusChip = document.getElementById('status');
let pollTimer = null;

function setStatus(html) {
  if (!html) { statusChip.className = 'status-chip'; statusChip.innerHTML = ''; return; }
  statusChip.className = 'status-chip on';
  statusChip.innerHTML = html;
}

async function doSearch() {
  const q = qInput.value.trim();
  if (!q) return;
  candBox.style.display = 'none';
  goBtn.disabled = true;
  setStatus('<span class="spin"></span>搜索地点中… Searching…');
  try {
    const c0 = map.getCenter();
    const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}&bias_lat=${c0.lat.toFixed(4)}&bias_lon=${c0.lng.toFixed(4)}`);
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const { candidates } = await res.json();
    setStatus('');
    if (!candidates.length) { setStatus('没有找到该地点 · No results'); return; }
    candBox.innerHTML = '';
    candidates.forEach(c => {
      const div = document.createElement('div');
      div.className = 'candidate';
      div.innerHTML = `<b>${c.name}</b><small>${c.display_name}</small>`;
      div.addEventListener('click', () => { candBox.style.display = 'none'; loadArea(c); });
      candBox.appendChild(div);
    });
    candBox.style.display = '';
  } catch (e) {
    setStatus(`搜索失败 Search failed: ${e.message}`);
  } finally {
    goBtn.disabled = false;
  }
}

async function loadArea(c) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  setStatus(`<span class="spin"></span>计算 ${c.name} 周边范围（约 10–20 秒）… Computing area…`);
  const url = `/api/area?lat=${c.lat}&lon=${c.lon}&name=${encodeURIComponent(c.name)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const area = await res.json();
    clearArea();
    setTitle(c.name);
    document.getElementById('landmark-legend').style.display = 'none';
    renderBoundary(area.boundary, `${c.name}<br><small>${c.display_name}</small>`, c.lat, c.lon);
    renderFacilities(area.facilities, true);
    const bm = area.boundary.metadata || {};
    const snapNote = bm.snap_distance_m > 300
      ? `范围自景点最近的公共道路起算（距地标点约 ${bm.snap_distance_m} 米）。<br>` +
        `The area starts from the nearest public road (~${bm.snap_distance_m} m from the pin).<br>`
      : '';
    renderMeta(bm, area.facilities.metadata, snapNote);
    if (area.status === 'enriching') {
      setStatus('<span class="spin"></span>基础设施已显示，正在用 Overture 数据补全（约 1 分钟）… Enriching with Overture…');
      pollTimer = setInterval(async () => {
        try {
          const r = await fetch(url);
          if (!r.ok) return;
          const a = await r.json();
          if (a.status === 'complete') {
            clearInterval(pollTimer); pollTimer = null;
            renderFacilities(a.facilities, false);
            renderMeta(a.boundary.metadata || {}, a.facilities.metadata);
            setStatus(`设施数据已补全（共 ${a.total} 个）· Facilities complete (${a.total})`);
            setTimeout(() => setStatus(''), 6000);
          } else if (a.status === 'osm_only') {
            clearInterval(pollTimer); pollTimer = null;
            setStatus('Overture 补全失败，当前仅显示 OSM 数据 · Overture enrichment failed; showing OSM data only');
          }
        } catch (e) { /* keep polling */ }
      }, 6000);
    } else {
      setStatus('');
    }
  } catch (e) {
    setStatus(`计算失败 Failed: ${e.message}`);
  }
}

goBtn.addEventListener('click', doSearch);
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

loadApplePark();
</script>
</body>
</html>
